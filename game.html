<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي صافرة الـ 90+ • عِـزوة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- مكتبة القصاصات الاحتفالية Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-accent: #E5A93C;
      --border-accent: rgba(229, 169, 60, 0.4);
      --bg-dark: #0D0E12;
      --club-badge-bg: linear-gradient(135deg, #E5A93C, #B37D22);
      --club-badge-text: #000;
    }

    body.theme-default {
      --primary-accent: #E5A93C;
      --border-accent: rgba(229, 169, 60, 0.4);
      --club-badge-bg: linear-gradient(135deg, #E5A93C, #B37D22);
      --club-badge-text: #000;
    }
    body.theme-hilal {
      --primary-accent: #1958CD;
      --border-accent: rgba(25, 88, 205, 0.5);
      --club-badge-bg: linear-gradient(135deg, #1958CD, #0C2E75);
      --club-badge-text: #FFF;
    }
    body.theme-nassr {
      --primary-accent: #FEDB00;
      --border-accent: rgba(254, 219, 0, 0.5);
      --club-badge-bg: linear-gradient(135deg, #FEDB00, #0045A0);
      --club-badge-text: #000;
    }
    body.theme-itti {
      --primary-accent: #FEDB00;
      --border-accent: rgba(254, 219, 0, 0.5);
      --club-badge-bg: linear-gradient(135deg, #FEDB00, #C59B27);
      --club-badge-text: #000;
    }
    body.theme-ahli {
      --primary-accent: #008744;
      --border-accent: rgba(0, 135, 68, 0.5);
      --club-badge-bg: linear-gradient(135deg, #008744, #004D25);
      --club-badge-text: #FFF;
    }
    body.theme-shabab {
      --primary-accent: #E63946;
      --border-accent: rgba(230, 57, 70, 0.5);
      --club-badge-bg: linear-gradient(135deg, #E63946, #1A1A1A);
      --club-badge-text: #FFF;
    }
    body.theme-ksa {
      --primary-accent: #006C35;
      --border-accent: rgba(0, 108, 53, 0.55);
      --club-badge-bg: linear-gradient(135deg, #006C35, #D4AF37);
      --club-badge-text: #FFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1A1D24, var(--bg-dark));
      color: #FFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* اهتزاز الشاشة الاحتفالي عند الفوز */
    .screen-shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .challenge-card {
      background: #111317;
      border: 1px solid var(--border-accent);
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 15px var(--border-accent);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .challenge-card.winner-glow {
      border-color: #00E676;
      box-shadow: 0 0 60px rgba(0, 230, 118, 0.4), 0 0 20px rgba(255, 215, 0, 0.6);
      transform: scale(1.02);
    }

    .title-gold {
      color: var(--primary-accent);
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .sub-text {
      font-size: 0.75rem;
      color: #8E929C;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .clubs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .club-pick-btn {
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #171920;
      color: #FFF;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }
    .club-pick-btn:active { transform: scale(0.96); }
    .btn-hilal { border-right: 5px solid #1958CD; }
    .btn-nassr { border-right: 5px solid #FEDB00; }
    .btn-itti  { border-right: 5px solid #FEDB00; }
    .btn-ahli  { border-right: 5px solid #008744; }
    .btn-shabab{ border-right: 5px solid #E63946; }
    .btn-ksa   { border-right: 5px solid #006C35; }

    .match-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--club-badge-bg);
      color: var(--club-badge-text);
      font-size: 0.8rem;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .timer-display-box {
      background: #08090C;
      border: 2px solid var(--border-accent);
      border-radius: 16px;
      padding: 32px 10px;
      margin-bottom: 15px;
      position: relative;
    }

    #matchClock {
      font-size: 3.8rem;
      font-weight: 900;
      font-family: monospace;
      color: var(--primary-accent);
      letter-spacing: 2px;
      display: block;
    }

    .clutch-alert {
      display: none;
      font-size: 0.85rem;
      color: var(--primary-accent);
      font-weight: 900;
      margin-top: 6px;
      animation: pulseAlert 0.4s infinite alternate;
    }
    .clutch-phase .clutch-alert { display: block; }
    @keyframes pulseAlert { from { opacity: 0.4; } to { opacity: 1; } }

    .instruction-line {
      font-size: 0.8rem;
      color: #CCC;
      margin-bottom: 18px;
    }

    .action-trigger-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: var(--primary-accent);
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .action-trigger-btn.stop-btn {
      background: #E63946;
      color: #FFF;
      animation: pulse 0.7s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .res-icon { 
      font-size: 4.2rem; 
      margin-bottom: 8px; 
      display: inline-block;
      animation: popTrophy 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popTrophy {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .res-title { 
      font-size: 1.6rem; 
      font-weight: 900; 
      margin-bottom: 8px; 
    }
    
    .stop-time-badge-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed var(--border-accent);
      border-radius: 12px;
      padding: 10px 14px;
      margin: 12px auto 14px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .stop-time-label {
      font-size: 0.7rem;
      color: #8E929C;
      font-weight: 700;
    }
    .stop-time-value {
      font-size: 2.2rem;
      font-weight: 900;
      font-family: monospace;
      color: var(--primary-accent);
      letter-spacing: 2px;
    }

    .res-desc { font-size: 0.9rem; color: #EEE; line-height: 1.6; margin-bottom: 18px; }
    
    .nfc-unlock-anim {
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 200, 83, 0.05));
      border: 2px solid #00E676;
      color: #69F0AE;
      font-size: 1rem;
      font-weight: 900;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 15px rgba(0, 230, 118, 0.3); }
      to { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 230, 118, 0.6); }
    }
  </style>
</head>
<body class="theme-default">

<div class="challenge-card" id="mainCard">
  
  <!-- خطوة 1: اختيار راية النادي -->
  <div id="clubStep">
    <h2 class="title-gold">اختر راية مدرجك 🏟️</h2>
    <p class="sub-text">اختر ناديك لضبط إيقاع التحدي لانتزاع بطاقة الـ NFC الفيزيائية</p>
    
    <div class="clubs-grid">
      <button class="club-pick-btn btn-hilal" onclick="selectMatchClub('hilal')">🔵 الهلال</button>
      <button class="club-pick-btn btn-nassr" onclick="selectMatchClub('nassr')">🟡 النصر</button>
      <button class="club-pick-btn btn-itti" onclick="selectMatchClub('itti')">⚫ الاتحاد</button>
      <button class="club-pick-btn btn-ahli" onclick="selectMatchClub('ahli')">🟢 الأهلي</button>
      <button class="club-pick-btn btn-shabab" onclick="selectMatchClub('shabab')">🔴 الشباب</button>
      <button class="club-pick-btn btn-ksa" onclick="selectMatchClub('ksa')">🦅 المنتخب</button>
    </div>
  </div>

  <!-- خطوة 2: شاشة المؤقت وحبس الأنفاس -->
  <div id="timerStep" style="display: none;">
    <div class="match-badge" id="selectedClubBadge">الموج الأزرق</div>
    
    <div class="timer-display-box" id="timerBox">
      <span id="matchClock">00:00</span>
      <div id="clutchAlert" class="clutch-alert">⚡ ترقّب الصافرة بدقة!</div>
    </div>

    <div class="instruction-line">المطلوب: أوقف العداد بين <strong>90:00</strong> و <strong>90:50</strong> بالضبط</div>

    <button id="mainActionBtn" class="action-trigger-btn" onclick="handleChallengeAction()">
      انطلاق المباراة ⏱️
    </button>
  </div>

  <!-- خطوة 3: إعلان النتيجة -->
  <div id="resultStep" style="display: none;">
    <div id="resultIcon" class="res-icon">🏆</div>
    <h3 id="resultTitle" class="res-title">هدف في التسعين!</h3>
    
    <div class="stop-time-badge-box">
      <span class="stop-time-label">توقيت إيقافك الدقيق:</span>
      <span class="stop-time-value" id="finalStoppedTimeDisplay">00:00</span>
    </div>

    <p id="resultDesc" class="res-desc"></p>
    
    <div id="winnerNfcCardBox" style="display: none;">
      <div class="nfc-unlock-anim">📶 انفتحت الخزنة.. استلم بطاقتك الذكية الآن! 🏆</div>
    </div>

    <button class="action-trigger-btn" onclick="resetChallenge()">خوض التحدي مجدداً 🔄</button>
  </div>

</div>

<script>
  let challengeState = 'IDLE';
  let startTime = null;
  let timerInterval = null;
  let currentClub = 'default';
  let audioCtx = null;

  let currentMinuteProgress = 0;
  let savedStopMinute = 0;
  let savedStopCentis = 0;

  const clubTitles = {
    hilal: "الموج الأزرق 🔵⚪",
    nassr: "فارس نجد 🟡🔵",
    itti: "مدرج الذهب 🟡⚫",
    ahli: "قلعة الكؤوس 🟢⚪",
    shabab: "عرين الليث ⚪🔴",
    ksa: "صقور الوطن 🟢⚪"
  };

  function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playHeartbeat() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(85, ctx.currentTime);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
  }

  function playCleanStop() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
  }

  // موسيقى فوز ونغمات تتويج احتفالية تصاعدية
  function playEpicWinTrophyFanfare() {
    try {
      const ctx = getAudioContext();
      const fanfareNotes = [
        { f: 523.25, d: 0.15, delay: 0 },     // C5
        { f: 523.25, d: 0.15, delay: 0.15 },  // C5
        { f: 523.25, d: 0.15, delay: 0.3 },   // C5
        { f: 659.25, d: 0.35, delay: 0.45 },  // E5
        { f: 783.99, d: 0.3, delay: 0.8 },    // G5
        { f: 1046.50, d: 0.8, delay: 1.1 }    // High C6
      ];

      fanfareNotes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.delay);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + n.delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.delay + n.d);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + n.delay);
        osc.stop(ctx.currentTime + n.delay + n.d);
      });
    } catch(e) {}
  }

  function playMissSound() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch(e) {}
  }

  // إطلاق مدافع القصاصات الاحتفالية في جميع أنحاء الشاشة
  function launchConfettiCelebration() {
    if (typeof confetti !== 'function') return;

    // رشقة مركزية قوية
    confetti({
      particleCount: 120,
      spread: 90,
      origin: { y: 0.6 },
      colors: ['#FFD700', '#FFA500', '#00E676', '#FFFFFF']
    });

    // إطلاق مدافع من أطراف الشاشة لزيادة البهجة
    setTimeout(() => {
      confetti({
        particleCount: 60,
        angle: 60,
        spread: 55,
        origin: { x: 0, y: 0.7 },
        colors: ['#FFD700', '#1958CD', '#FEDB00']
      });
      confetti({
        particleCount: 60,
        angle: 120,
        spread: 55,
        origin: { x: 1, y: 0.7 },
        colors: ['#FFD700', '#00E676', '#FFFFFF']
      });
    }, 250);
  }

  function selectMatchClub(clubKey) {
    currentClub = clubKey;
    document.body.className = `theme-${clubKey}`;
    document.getElementById('selectedClubBadge').innerText = clubTitles[clubKey] || "المدرج الذهبي";
    document.getElementById('clubStep').style.display = 'none';
    document.getElementById('timerStep').style.display = 'block';
  }

  function handleChallengeAction() {
    const btn = document.getElementById('mainActionBtn');

    if (challengeState === 'IDLE') {
      challengeState = 'RUNNING';
      btn.innerText = "أوقف العداد الآن! 🛑";
      btn.classList.add('stop-btn');
      playCleanStop();
      startMatchClock();
    } else if (challengeState === 'RUNNING') {
      challengeState = 'STOPPED';
      clearInterval(timerInterval);
      
      savedStopMinute = Math.floor(currentMinuteProgress);
      savedStopCentis = Math.floor((currentMinuteProgress % 1) * 100);

      playCleanStop();
      evaluateScore();
    }
  }

  function startMatchClock() {
    startTime = Date.now();
    const clockEl = document.getElementById('matchClock');
    const timerBox = document.getElementById('timerBox');
    let lastBeat = 0;

    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;

      if (elapsed <= 5000) {
        currentMinuteProgress = (elapsed / 5000) * 80;
      } else {
        currentMinuteProgress = 80 + ((elapsed - 5000) / 4000) * 15;
      }
      
      const mins = Math.floor(currentMinuteProgress);
      const centis = Math.floor((currentMinuteProgress % 1) * 100);
      clockEl.innerText = `${String(mins).padStart(2, '0')}:${String(centis).padStart(2, '0')}`;

      if (mins % 15 === 0 && mins !== lastBeat) {
        playHeartbeat();
        lastBeat = mins;
      }

      if (currentMinuteProgress >= 88) {
        timerBox.classList.add('clutch-phase');
      }

      if (currentMinuteProgress >= 95) {
        clearInterval(timerInterval);
        challengeState = 'STOPPED';
        savedStopMinute = Math.floor(currentMinuteProgress);
        savedStopCentis = Math.floor((currentMinuteProgress % 1) * 100);
        evaluateScore();
      }
    }, 16);
  }

  function evaluateScore() {
    const timeFormatted = `${String(savedStopMinute).padStart(2, '0')}:${String(savedStopCentis).padStart(2, '0')}`;
    const cardEl = document.getElementById('mainCard');
    
    document.getElementById('timerBox').classList.remove('clutch-phase');
    document.getElementById('timerStep').style.display = 'none';
    document.getElementById('resultStep').style.display = 'block';

    document.getElementById('finalStoppedTimeDisplay').innerText = timeFormatted;

    // نافذة الفوز الدقيقة: بين 90:00 و 90:50
    const isWinner = (savedStopMinute === 90 && savedStopCentis <= 50);

    const titleEl = document.getElementById('resultTitle');
    const descEl = document.getElementById('resultDesc');
    const iconEl = document.getElementById('resultIcon');
    const cardUnlockEl = document.getElementById('winnerNfcCardBox');

    if (isWinner) {
      // تفعيل تأثيرات الحماس
      cardEl.classList.add('winner-glow');
      document.body.classList.add('screen-shake');
      setTimeout(() => document.body.classList.remove('screen-shake'), 600);

      playEpicWinTrophyFanfare();
      launchConfettiCelebration();

      iconEl.innerText = "🏆";
      titleEl.innerText = "هدف قاتل في الـتسعين!";
      titleEl.style.color = "#00E676";
      descEl.innerHTML = `توقيت تاريخي استثنائي عند <strong style="color:#FFF;">${timeFormatted}</strong>!<br>أثبتّ مهارة لا تتكرر واستحققت بطاقة <strong>${clubTitles[currentClub]}</strong> الذكية!`;
      cardUnlockEl.style.display = "block";
    } else {
      cardEl.classList.remove('winner-glow');
      playMissSound();
      iconEl.innerText = "⚽❌";
      titleEl.innerText = "مرّت بجوار القائم!";
      titleEl.style.color = "#E63946";
      
      let note = savedStopMinute < 90 ? "استعجلت التسديد قبل اكتمال الـ 90 دقيقة!" : "تأخرت وتجاوزت نطاق الـ 90:50 المحدد!";
      descEl.innerHTML = `${note}<br>حاول مجدداً لتخطف الفوز بدقة في الـ 90.`;
      cardUnlockEl.style.display = "none";
    }
  }

  function resetChallenge() {
    challengeState = 'IDLE';
    clearInterval(timerInterval);
    currentMinuteProgress = 0;
    savedStopMinute = 0;
    savedStopCentis = 0;

    const cardEl = document.getElementById('mainCard');
    cardEl.classList.remove('winner-glow');
    document.body.classList.remove('screen-shake');

    document.getElementById('timerBox').classList.remove('clutch-phase');
    document.getElementById('matchClock').innerText = "00:00";
    document.getElementById('mainActionBtn').innerText = "انطلاق المباراة ⏱️";
    document.getElementById('mainActionBtn').classList.remove('stop-btn');

    document.getElementById('resultStep').style.display = 'none';
    document.getElementById('timerStep').style.display = 'none';
    document.getElementById('clubStep').style.display = 'block';
  }
</script>

</body>
</html>
